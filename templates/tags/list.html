{% extends "base.html" %}

{% block title %}Tags — {{ config.title }}{% endblock title %}

{% block content %}
<div class="reading-page">
  <h1>Tags</h1>
  <ul class="inline-links" role="list">
    {% for term in terms %}
    <li><a href="{{ term.permalink }}">{{ term.name }}</a> ({{ term.pages | length }})</li>
    {% endfor %}
  </ul>
</div>
{% endblock content %}
