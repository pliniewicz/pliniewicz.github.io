<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}" />
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }} — notes" href="{{ get_url(path="atom.xml") }}" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🔭</text></svg>" />
  {% block og %}
  <meta property="og:title" content="{{ config.title }}" />
  <meta property="og:description" content="{{ config.description }}" />
  {% endblock og %}
  <meta property="og:site_name" content="{{ config.title }}" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="{{ get_url(path="photo.jpg") }}" />
  <meta name="twitter:card" content="summary" />
  <link rel="stylesheet" href="{{ get_url(path="fonts.css") }}" />
  <link rel="stylesheet" href="{{ get_url(path="style.css") }}" />
  {% block extra_head %}{% endblock extra_head %}
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <nav class="site-nav wrap" aria-label="Main navigation">
    <a class="site-name" href="/">Patryk Liniewicz</a>
    <ul class="inline-links" role="list">
      <li><a href="/#research">Research</a></li>
      <li><a href="/#publications">Papers</a></li>
      <li><a href="/#talks">Talks</a></li>
      <li><a href="/#teaching">Teaching</a></li>
      <li><a href="/notes/">Notes</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main id="main" class="wrap">
{% block content %}{% endblock content %}
</main>

<footer class="site-footer wrap">
  <p>Built with <a href="https://www.getzola.org">Zola</a> with a little help from Claude</p>
  <a href="{{ get_url(path="atom.xml") }}">RSS</a>
</footer>

</body>
</html>
